<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapScope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="eyebrow">Explore the world</p>
        <h1>MapScope</h1>
        <p class="subtitle">
          Discover major cities, jump to your location, and inspect coordinates with a
          beautiful interactive map experience.
        </p>
      </div>
      <div class="controls">
        <button id="locateBtn">Use my location</button>
        <button id="resetBtn" class="secondary">Reset view</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Featured places</h2>
        <p>Click a place to fly to it on the map.</p>
        <ul id="placesList" class="places"></ul>
      </section>

      <section class="map-wrapper">
        <div id="map" aria-label="Interactive map"></div>
        <div class="readout" id="coordReadout">Lat: --, Lng: --</div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="script.js"></script>
  </body>
</html>
